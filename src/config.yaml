features:
  - title: Read variants in their haplotype context
    desc: |
      Haplodon is a command line tool written in Rust for uncertainty-aware, haplotype-based genomic variant effect prediction. Instead of interpreting variants independently, it models them in a graph whose paths represent haplotypes, integrating read evidence of variant co-occurrence from the uncertainty-aware caller varlociraptor. For each haplotype it reconstructs the protein sequence of the affected transcripts and scores its physicochemical divergence from the reference.
    img: haplodon.svg
    img-width: min(30vw, 550px)
    url: https://github.com/fxwiegand/haplodon

